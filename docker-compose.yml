services:
  n8n:
    image: n8nio/n8n:2.28.6
    container_name: forgeai-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - TZ=Asia/Kolkata
    volumes:
      - ./n8n_data:/home/node/.n8n
    restart: unless-stopped